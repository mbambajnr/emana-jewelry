name: CI Pipeline & Test Automation

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: emana_ci
          MYSQL_PASSWORD: emana_ci
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: emana_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXT_TELEMETRY_DISABLED: 1
      RUN_MYSQL_INTEGRATION: "1"
      SESSION_SECRET: test-secret-key-32-chars-minimum-xyz
      NEXT_PUBLIC_SITE_URL: "https://emanajewelries.com"
      ORANGEHOST_STANDALONE: "1"
      DATABASE_URL: "mysql://emana_ci:emana_ci@127.0.0.1:3306/emana_test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (OrangeHost 20.20.2)
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test -- --maxWorkers=2 --testTimeout=30000

      - name: Run Production Build
        run: npm run build

      - name: Package OrangeHost Linux runtime
        run: |
          npm run hosting:package
          tar -czf build/emana-orangehost-linux-x64.tar.gz -C build/orangehost .
          sha256sum build/emana-orangehost-linux-x64.tar.gz > build/emana-orangehost-linux-x64.sha256

      - name: Upload tested deployment package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: emana-orangehost-${{ github.sha }}
          path: |
            build/emana-orangehost-linux-x64.tar.gz
            build/emana-orangehost-linux-x64.sha256
          if-no-files-found: error
          retention-days: 14
