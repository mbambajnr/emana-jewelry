name: CI Pipeline & Test Automation

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mysql: ["5.7", "8.4"]

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_USER: emana_ci
          MYSQL_PASSWORD: emana_ci
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: emana_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXT_TELEMETRY_DISABLED: 1
      RUN_MYSQL_INTEGRATION: "1"
      SESSION_SECRET: test-secret-key-32-chars-minimum-xyz
      NEXT_PUBLIC_SITE_URL: "https://emanajewelries.com"
      ORANGEHOST_STANDALONE: "1"
      DATABASE_URL: "mysql://emana_ci:emana_ci@127.0.0.1:3306/emana_test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for development checks (24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test -- --maxWorkers=2 --testTimeout=30000

      - name: Switch to OrangeHost runtime (20.20.2)
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Run Production Build
        run: npm run build

      - name: Package OrangeHost Linux runtime
        run: |
          npm run hosting:package
          tar -czf build/emana-orangehost-linux-x64.tar.gz -C build/orangehost .
          sha256sum build/emana-orangehost-linux-x64.tar.gz > build/emana-orangehost-linux-x64.sha256

      - name: Smoke test runtime without native image dependencies
        run: |
          mkdir -p build/runtime-media
          cp public/gold_signet_ring.jpg build/runtime-media/00000000-0000-0000-0000-000000000000.jpg
          HOSTNAME=127.0.0.1 PORT=3010 PRODUCT_IMAGE_DIRECTORY="$PWD/build/runtime-media" node build/orangehost/server.js > build/runtime-smoke.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3010/ > /dev/null
          curl --fail --silent http://127.0.0.1:3010/media/products/00000000-0000-0000-0000-000000000000.jpg -o build/runtime-photo.jpg
          cmp public/gold_signet_ring.jpg build/runtime-photo.jpg
          test "$(curl --silent -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3010/api/admin/upload)" = 401

      - name: Upload tested deployment package
        if: github.event_name != 'pull_request' && matrix.mysql == '5.7'
        uses: actions/upload-artifact@v7
        with:
          name: emana-orangehost-${{ github.sha }}
          path: |
            build/emana-orangehost-linux-x64.tar.gz
            build/emana-orangehost-linux-x64.sha256
          if-no-files-found: error
          retention-days: 14
