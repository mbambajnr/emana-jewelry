name: CI Pipeline & Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: emana_ci
          MYSQL_PASSWORD: emana_ci
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: emana_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXT_TELEMETRY_DISABLED: 1
      RUN_MYSQL_INTEGRATION: "1"
      SESSION_SECRET: test-secret-key-32-chars-minimum-xyz
      DATABASE_URL: "mysql://emana_ci:emana_ci@127.0.0.1:3306/emana_test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test

      - name: Run Production Build
        run: npm run build
